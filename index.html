<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mali Portal — prototype</title>
<style>
:root { --cell: 66px; --gold: #d9b45a; --gold2: #f3d98a; --indigo: #2b3a7a; --ind2: #1a2350; --lime: #e8dcc2; --bronze: #3a2a1a; --ink: #f1e6cc; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0806; color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
body { touch-action: manipulation; }
#app { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 480px; height: 100%; margin: 0 auto; overflow: hidden;
  background: radial-gradient(90% 40% at 50% 100%, rgba(217,140,60,.20), rgba(0,0,0,0) 70%), radial-gradient(70% 30% at 15% 45%, rgba(255,150,50,.10), rgba(0,0,0,0) 70%), radial-gradient(70% 30% at 85% 45%, rgba(255,150,50,.10), rgba(0,0,0,0) 70%),
    linear-gradient(180deg, #120d14 0%, #17131c 30%, #1c140d 70%, #120c07 100%); }
#app::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(232,220,194,.035) 0 1px, rgba(0,0,0,0) 1px 14px), repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, rgba(0,0,0,0) 1px 28px); }
/* top bar: engraved metal */
#top { position: relative; z-index: 5; flex: none; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font: 600 12px/1 Georgia, serif; letter-spacing: .5px;
  background: linear-gradient(180deg, #4a3a24, #2a1f12 60%, #1a130b); border-bottom: 1px solid #8a6d36; box-shadow: inset 0 1px 0 rgba(255,230,160,.25), 0 2px 6px rgba(0,0,0,.6); color: #cbb88e; text-transform: uppercase; }
#top b { color: var(--gold2); font-size: 14px; letter-spacing: 0; text-shadow: 0 1px 0 #000; }
#info { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #b08d48; color: var(--gold2); display: flex; align-items: center; justify-content: center; font: italic 700 13px Georgia, serif; background: radial-gradient(circle at 40% 35%, #5a4628, #241a0e); }
/* pots */
#pots { position: relative; flex: none; height: var(--pots, 120px); display: flex; justify-content: center; align-items: flex-end; gap: 6px; padding: 0 10px 4px; transition: height .4s; }
#pots::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: 2px; height: 7px; border-radius: 3px; background: linear-gradient(180deg, #8a6d36, #3a2a14); box-shadow: 0 3px 6px rgba(0,0,0,.7); }
.pot { position: relative; z-index: 2; height: calc(var(--pots, 120px) - 8px); width: 27%; max-width: 120px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: height .4s; }
.pot.portal { width: 34%; max-width: 150px; }
.pot svg { flex: 1; width: 100%; min-height: 0; overflow: visible; }
.pot .pl { flex: none; margin-top: -2px; font: 700 9.5px/1 Georgia, serif; letter-spacing: 1.5px; color: #2a1d0c; padding: 2px 6px 2px; border-radius: 3px; background: linear-gradient(180deg, #e9cf86, #a8833c); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 2px #000; }
.pot.ready svg { filter: drop-shadow(0 0 10px rgba(243,217,138,.85)); animation: potglow 1.6s infinite alternate; }
.pot.expand.ready svg { filter: drop-shadow(0 0 10px rgba(110,140,255,.95)); }
@keyframes potglow { from { transform: translateY(0); } to { transform: translateY(-2px); } }
.pot.off { opacity: .32; filter: grayscale(.8); }
.pot.boil svg { animation: shake .18s infinite alternate; }
@keyframes shake { from { transform: translate(-1px, 0) rotate(-1.5deg); } to { transform: translate(1px, -1px) rotate(1.5deg); } }
body.inF .pot .pl { font-size: 8px; padding: 1px 4px; }
/* base stage */
#stage { position: relative; flex: none; margin: var(--gap, 8px) auto 0; width: calc(var(--cell) * 5 + 14px); padding: 7px; border-radius: 6px;
  background: linear-gradient(180deg, #6b5330, #3b2c18 30%, #2a1e10 70%, #5a4426); box-shadow: inset 0 0 0 1px #c9a55a, inset 0 0 0 3px #2a1d0c, inset 0 0 0 4px #8a6d36, 0 12px 26px rgba(0,0,0,.7); }
#stage::before { content: ""; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); width: 120px; height: 12px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #c9a55a, #6b5330); }
body.inF #stage { display: none; }
#reels { position: relative; display: flex; }
.reel { position: relative; width: var(--cell); height: calc(var(--cell) * 3); overflow: hidden; background: linear-gradient(180deg, #d9cbb0, #efe5d0 50%, #d4c4a6); border-right: 1px solid #8a7656; }
.reel:last-child { border-right: 0; }
.reel::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(40,25,10,.45), rgba(0,0,0,0) 14%, rgba(0,0,0,0) 86%, rgba(40,25,10,.45)); }
.strip { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
.sym { position: relative; width: var(--cell); height: var(--cell); display: flex; align-items: center; justify-content: center; }
.sym svg { width: 86%; height: 86%; overflow: visible; filter: drop-shadow(0 2px 1.5px rgba(40,20,0,.55)); }
.sym.win { animation: symwin .6s ease-in-out 2; z-index: 2; }
@keyframes symwin { 50% { transform: scale(1.14); filter: brightness(1.25); } }
.sym.dimx { opacity: .45; }
#lines { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#cap { flex: none; height: 26px; margin-top: 6px; text-align: center; font: 700 15px/26px Georgia, serif; color: var(--gold2); text-shadow: 0 1px 2px #000; letter-spacing: .5px; }
#hint { flex: none; text-align: center; font-size: 11px; color: rgba(241,230,204,.45); letter-spacing: 2px; text-transform: uppercase; transition: opacity .4s; }
body.inF #hint, body.inF #cap { display: none; }
/* feature tower */
#fbar { display: none; flex: none; align-items: center; justify-content: space-between; height: 32px; margin: 2px 8px 0; padding: 0 10px; border-radius: 4px;
  background: linear-gradient(180deg, #3b2c18, #1e160c); border: 1px solid #8a6d36; box-shadow: inset 0 1px 0 rgba(255,230,160,.2); }
body.inF #fbar { display: flex; }
#resp { display: flex; gap: 5px; }
#resp i { width: 13px; height: 13px; transform: rotate(45deg); border: 1.5px solid var(--gold); background: rgba(0,0,0,.4); }
#resp i.on { background: linear-gradient(135deg, #fff2c0, var(--gold) 60%, #8a6526); box-shadow: 0 0 6px var(--gold); }
#resp.reset i.on { animation: pip .5s; }
@keyframes pip { 0% { transform: rotate(45deg) scale(1.9); } 100% { transform: rotate(45deg) scale(1); } }
#fheld { font: 600 11px Georgia; letter-spacing: 1px; color: #cbb88e; } #fheld b { color: var(--gold2); font-size: 13px; }
#ftot { font: 700 18px Georgia, serif; color: var(--gold2); text-shadow: 0 1px 0 #000; }
#tower { display: none; position: relative; flex: 1; justify-content: center; min-height: 0; margin: 4px auto 6px; width: calc(var(--cw) * 5 + 12px); flex-direction: column; gap: 4px; }
body.inF #tower { display: flex; }
.set { position: relative; flex: none; display: grid; grid-template-columns: repeat(5, var(--cw)); grid-template-rows: repeat(3, var(--rh)); padding: 3px; border-radius: 5px; transition: all .45s ease; }
.set .lv { position: absolute; left: -3px; top: 50%; transform: translate(-100%, -50%); font: 700 9px Georgia; color: rgba(243,217,138,.5); writing-mode: vertical-rl; letter-spacing: 1px; }
.set[data-k="0"] { background: linear-gradient(180deg, #e6d6b6, #cdb88f); box-shadow: inset 0 0 0 1px #fff3d0, 0 0 0 2px #8a6d36, 0 0 22px rgba(255,170,60,.35); }
.set[data-k="1"] { background: linear-gradient(180deg, #24306a, #18204a); box-shadow: inset 0 0 0 1px #4a5aa0, 0 0 0 2px #5a4a2a; }
.set[data-k="2"] { background: linear-gradient(180deg, #141a3c, #0c0f24); box-shadow: inset 0 0 0 1px #8a6d36, 0 0 0 2px #3a2a14; }
.set[data-k="3"] { background: linear-gradient(180deg, #f6b98a 0%, #c9786a 18%, #4a3a6a 55%, #1a1838 100%); box-shadow: inset 0 0 0 1px #f3d98a, 0 0 0 2px #c9a55a, 0 0 26px rgba(255,190,120,.35); }
.set.front { box-shadow: inset 0 0 0 1px #fff3d0, 0 0 0 2px #f3d98a, 0 0 24px rgba(243,217,138,.55); }
.set.goal::after { content: ""; position: absolute; inset: -2px; border-radius: 6px; border: 2px dashed rgba(243,217,138,.55); pointer-events: none; animation: goal 1.6s infinite alternate; }
@keyframes goal { from { opacity: .35; } to { opacity: 1; } }
.set.far { filter: brightness(.75) saturate(.8); }
.cell { position: relative; display: flex; align-items: center; justify-content: center; }
.cell svg.c { width: calc(min(var(--cw), var(--rh)) * .92); height: calc(min(var(--cw), var(--rh)) * .92); overflow: visible; }
.cell .v { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 calc(min(var(--cw), var(--rh)) * .25)/1 Georgia, serif; color: #2a1806; text-shadow: 0 1px 0 rgba(255,240,190,.7); white-space: nowrap; pointer-events: none; }
.cell.locked svg.c { opacity: .8; filter: saturate(.75); }
.cell.locked .v { opacity: .95; }
.set[data-k="0"] .cell.live, .cell.live { background: radial-gradient(circle, rgba(255,240,200,.18), rgba(0,0,0,.35)); border-radius: 4px; box-shadow: inset 0 0 0 1.5px rgba(255,236,170,.9), inset 0 0 10px rgba(255,210,120,.45); }
.set[data-k="0"] .cell.live { background: radial-gradient(circle, rgba(60,40,20,.15), rgba(60,40,20,.42)); box-shadow: inset 0 0 0 1.5px #8a6d36; }
.cell.spin::before { content: ""; position: absolute; inset: 10%; border-radius: 4px; background: repeating-linear-gradient(180deg, rgba(217,180,90,.0) 0 6px, rgba(217,180,90,.55) 6px 9px); animation: spinc .18s linear infinite; }
@keyframes spinc { from { background-position: 0 0; } to { background-position: 0 15px; } }
.cell.gild svg.c { filter: drop-shadow(0 0 4px #ffe08a) brightness(1.15) saturate(1.2); opacity: .95; }
.cell.gild::after { content: ""; position: absolute; right: 8%; top: 8%; width: 22%; height: 22%; max-width: 12px; max-height: 12px; transform: rotate(45deg); background: linear-gradient(135deg, #fff6c8, #e2b955); box-shadow: 0 0 6px #ffe08a; }
.cell.held.coin svg.c { filter: drop-shadow(0 0 5px rgba(255,214,120,.95)); }
.cell.held.coin { background: radial-gradient(circle, rgba(255,214,120,.25), rgba(0,0,0,0) 70%); }
.cell.got svg.c, .cell.got .v { opacity: .35; }
.cell.pop { animation: cpop .35s ease-out; }
@keyframes cpop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.cell.flash { animation: cfl .5s; }
@keyframes cfl { 50% { filter: brightness(2.2); } }
#grandP { position: absolute; left: 50%; top: -2px; transform: translate(-50%, -100%); font: 800 10px/1 Georgia; letter-spacing: 2px; color: #2a1806; background: linear-gradient(180deg, #fff1bf, #c9a55a); padding: 2px 8px; border-radius: 3px; box-shadow: 0 0 10px rgba(255,210,130,.6); white-space: nowrap; z-index: 3; }
#beams { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 4; }
/* overlays */
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.fly { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; }
.float { position: absolute; font: 800 16px Georgia; color: var(--gold2); text-shadow: 0 2px 3px #000, 0 0 8px rgba(0,0,0,.8); white-space: nowrap; }
#big { display: none; position: absolute; left: 50%; top: 44%; z-index: 25; pointer-events: none; text-align: center; font: 800 34px/1.1 Georgia; letter-spacing: 3px; color: var(--gold2); text-shadow: 0 3px 0 #5a3a10, 0 0 24px rgba(255,200,100,.7); white-space: nowrap; }
#big small { display: block; font-size: 15px; letter-spacing: 2px; color: var(--ink); margin-top: 6px; }
.ov { position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(5,4,3,.72); }
.ov.on { display: flex; }
.card { width: 86%; max-width: 380px; padding: 18px 16px; text-align: center; border-radius: 6px; background: linear-gradient(180deg, #3b2c18, #1a130b); border: 1px solid #c9a55a; box-shadow: inset 0 0 0 3px #1a130b, inset 0 0 0 4px #8a6d36, 0 10px 40px #000; }
.card h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: 3px; color: var(--gold2); }
.card .big { font-size: 34px; font-weight: 800; color: var(--gold2); margin: 6px 0; }
.card .row { display: flex; justify-content: center; gap: 10px; margin: 8px 0; font-size: 13px; }
.card .chip { padding: 3px 8px; border-radius: 3px; border: 1px solid #8a6d36; }
.card .chip.on { background: linear-gradient(180deg, #e9cf86, #a8833c); color: #2a1d0c; font-weight: 700; }
.card .tapc { margin-top: 12px; font-size: 11px; letter-spacing: 2px; opacity: .6; text-transform: uppercase; }
#infoCard { max-height: 86%; overflow-y: auto; text-align: left; font-size: 12.5px; line-height: 1.45; }
#infoCard h2 { font-size: 14px; color: var(--gold2); margin: 10px 0 4px; letter-spacing: 1px; }
#infoCard table { width: 100%; border-collapse: collapse; font-size: 12px; }
#infoCard td { padding: 1px 3px; border-bottom: 1px solid rgba(201,165,90,.2); }
#infoCard svg { width: 26px; height: 26px; vertical-align: middle; }
#infoCard .btn { display: inline-block; margin: 6px 6px 0 0; padding: 5px 10px; border: 1px solid #c9a55a; border-radius: 3px; color: var(--gold2); }
#toast { display: none; position: absolute; left: 50%; top: 40px; transform: translateX(-50%); z-index: 40; background: rgba(20,14,8,.95); border: 1px solid #c9a55a; border-radius: 4px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
</style>
</head>

      if (e.type === 'collectEnd') { await endCollect(e); }
      else if (e.type === 'open') {
        var g = await beam(e.from, [e.set, e.cell], e.how), el = cellEl(e.set, e.cell), v = e.v;
        el.classList.add('flash'); await collectTo(el, v * C.BET, e.total);
        sets[e.set][e.cell] = { st: 'live' }; renderCell(e.set, e.cell, sets[e.set][e.cell]); el.classList.add('pop');
        anim(g, [{ opacity: 1 }, { opacity: 0 }], 400).then(function () { g.remove(); }); renderResp(F.RESPINS, true);
      }
      else if (e.type === 'noop') { var n = cellEl(e.from[0], e.from[1]); anim(n, [{ opacity: 1 }, { opacity: .4 }, { opacity: 1 }], 300); await wait(200); }
      else if (e.type === 'frontier') { S.feat.top = e.set; layoutTower(); await wait(480); }
      else if (e.type === 'grand') { $('set3').classList.add('flash'); await bigMsg('GRAND<small>+' + fm(e.x * C.BET) + '</small>', 1800); var ft = $('ftot'), f0 = S.feat.total; S.feat.total = e.total * C.BET; await tickNum(ft, f0, S.feat.total, 400); }
      else if (e.type === 'gild') {
        var setEl = $('set' + e.set); anim(setEl, [{ filter: 'brightness(1)' }, { filter: 'brightness(2.2) sepia(.6)' }, { filter: 'brightness(1)' }], 700);
        e.cells.forEach(function (q, n) { var c = sets[e.set][q[0]]; c.v = q[1]; c.gild = true; setTimeout(function () { renderCell(e.set, q[0], c); cellEl(e.set, q[0]).classList.add('pop'); }, dur(120 + n * 25)); });
        await wait(700 + e.cells.length * 25);
      }
      else if (e.type === 'state') { renderResp(e.respins, e.reset); setHeld(e.held); }
      else if (e.type === 'end') { /* summary after */ }
    }
  }
  function showSummary() {
    var run = S.feat.run, names = ['I', 'II', 'III', 'IV'], m = run.mods;
    $('sumCard').innerHTML = '<h1>PORTAL</h1><div class="big">+' + fm(run.win) + '</div><div class="row">' + names.map(function (n, k) { return '<span class="chip ' + (k <= run.top ? 'on' : '') + '">' + n + '</span>'; }).join('') + '</div>' +
      '<div class="row"><span class="chip ' + (m.expand ? 'on' : '') + '">EXPAND</span><span class="chip ' + (m.gild ? 'on' : '') + '">GILD</span>' + (run.grand ? '<span class="chip on">GRAND</span>' : '') + (run.capped ? '<span class="chip on">MAX WIN</span>' : '') + '</div><div class="tapc">Tap to collect</div>';
    $('ovSum').classList.add('on'); setMode('summary'); setBusy(false);
  }
  async function collect() {
    setBusy(true); $('ovSum').classList.remove('on'); var w = S.feat.run.win, b0 = S.balance;
    S.balance += w; S.lastWin = w; S.pending = null; save();
    document.body.classList.remove('inF'); for (var i = 1; i < 3; i++) $('pot' + i).classList.remove('off');
    $('beams').innerHTML = ''; S.feat = null; layout(); renderPots();
    cap('Portal win ' + fm(w)); await tickNum($('bal'), b0, S.balance, 600); renderTop();
    setMode('idle'); setBusy(false);
  }

  // ---------- info ----------
  function buildInfo() {
    var rows = ''; for (var s = 0; s < 8; s++) rows += '<tr><td><svg viewBox="0 0 100 100"><use href="#s' + s + '"/></svg> ' + C.NAMES[s] + '</td><td>' + [3, 4, 5].map(function (k) { return k + ': ' + fm(MP.pay(s, k)); }).join(' · ') + '</td></tr>';
    $('infoCard').innerHTML = '<h1>Mali Portal</h1><div>Prototype · bet ' + C.BET + ' (' + C.LINES + ' lines × ' + C.LINE_BET + ') · tap anywhere to spin, tap again to skip.</div>' +
      '<h2>Pays (credits)</h2><table>' + rows + '</table><div><svg viewBox="0 0 100 100"><use href="#s8"/></svg> Wild on reels 2–4, substitutes for all paying symbols.</div>' +
      '<h2>Pots</h2><div><b>Portal</b> (' + C.POT_CAP[0] + ' symbols) starts the Portal feature when full. <b>Expand</b> and <b>Gild</b> (' + C.POT_CAP[1] + ' each) stay charged until a feature uses them. Pot fills are saved.</div>' +
      '<h2>Portal feature</h2><div>Four 5×3 sets. Only the bottom set spins at first; the upper sets hold locked gold weights of growing value. Coins landing on live cells stick and reset respins to 3; they are collected at the end. A Portal opens the cell directly above: its weight is collected at once and the cell starts spinning. Expand does the same for a locked cell on the same set. Gild raises the locked weights on the set above your highest open set one step (each set stays inside its own value band). Opening a cell also resets respins to 3. Reaching set IV pays the Grand (' + fm(F.GRAND_X * C.BET) + ', example value). Max win ' + fm(F.MAX_WIN_X * C.BET) + '.</div>' +
      '<h2>Cheats</h2><div>Tap a pot to fill it. URL: ?bonus=1&expand=1&gild=1, ?seed=N, ?turbo=1</div>' +
      '<div><span class="btn" id="bTurbo">Turbo: ' + (TURBO ? 'on' : 'off') + '</span><span class="btn" id="bReset">Reset balance</span><span class="btn" id="bClose">Close</span></div>';
    $('bTurbo').onclick = function (e) { e.stopPropagation(); TURBO = !TURBO; this.textContent = 'Turbo: ' + (TURBO ? 'on' : 'off'); };
    $('bReset').onclick = function (e) { e.stopPropagation(); S.balance = C.START_BALANCE; S.lastWin = 0; S.pots = [0, 0, 0]; save(); renderTop(); renderPots(); toast('Balance and pots reset'); };
    $('bClose').onclick = function (e) { e.stopPropagation(); $('ovInfo').classList.remove('on'); };
  }
  $('info').addEventListener('click', function (e) { e.stopPropagation(); if (S.busy && S.mode !== 'featIdle') return; buildInfo(); $('ovInfo').classList.add('on'); });
  $('ovInfo').addEventListener('click', function (e) { e.stopPropagation(); if (e.target.id === 'ovInfo') $('ovInfo').classList.remove('on'); });

  // ---------- input ----------
  function onTap() {
    if ($('ovInfo').classList.contains('on')) return;
    if (S.busy) { skip(); return; }
    if (S.mode === 'idle') spin(); else if (S.mode === 'featIntro') startFeature(); else if (S.mode === 'featIdle') featSpin(); else if (S.mode === 'summary') collect();
  }
  $('app').addEventListener('pointerdown', function (e) { if (e.button > 0) return; var t = e.target; if (t.closest && (t.closest('#info') || t.closest('#ovInfo') || (t.closest('.pot') && S.mode === 'idle' && !S.busy))) return; onTap(); });

  // ---------- boot ----------
  load(); buildPots(); layout();
  var g0 = []; for (var x = 0; x < 5; x++) { var col = []; for (var y = 0; y < 3; y++) col.push(randSym(x) % 9 === 8 && (x === 0 || x === 4) ? 0 : randSym(x)); g0.push(col.map(function (s) { return s > 8 ? 4 : s; })); }
  buildReels(g0); renderTop(); setMode('idle'); setBusy(false);
  window.MP_UI = { state: S, layout: layout };
})();

</script>
</body>
